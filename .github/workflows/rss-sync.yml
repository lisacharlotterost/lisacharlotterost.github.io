name: Sync RSS to Jekyll

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Added permissions to allow the bot to commit files
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests Pillow
        
    - name: Sync RSS to Jekyll
      run: python .github/scripts/rss_sync.py
      env:
        RSS_FEED_URL: https://thelisaproject.tumblr.com/rss
        
    - name: Commit and push if changed
      run: |
        git config --global user.name 'RSS Sync Bot'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Sync posts and generate thumbs [skip ci]"
          git push
        fi
