# Dependencies
markdown:         kramdown
highlighter:      rouge


# Permalinks
permalink:        :title

# Setup
title:            Lisa Charlotte Muth
tagline:          Portfolio & Blog
description:      What Lisa writes, designs and talks about.
url:              https://lisacharlottemuth.com/
baseurl:          ""

author:
  name:           "Lisa Charlotte Muth"
  url:            https://x.com/lisacmuth
  email:          lisacharlottemuth@gmail.com
  twitter_user:   lisacmuth

collections:
  notes:
    output: true

defaults:
  - scope:
      path: ""
      type: "notes" # This targets everything in your _notes folder
    values:
      layout: "note"
      comments: "disabled"
      # This creates the /notes/2026/01/25 structure based on the file date
      permalink: "/notes/:year/:month/:day"

paginate:         5

# Category order on the home page. 
# When you update this, you need to restart Jekyll with bundle exec jekyll serve
category_order:
  - article
  - design
  - event
  - talk
  - notes

# Plugins
whitelist:        []
plugins:          [jekyll-paginate]

# Custom vars
version:          2.1.0

github:
  repo:           blog.lisacharlotterost.de
  sass:
    sass_dir:     _sass
